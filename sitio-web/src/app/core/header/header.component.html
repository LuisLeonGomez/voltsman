<header class="site-header">
  <div class="site-header__bar">
    <a routerLink="/" class="site-header__brand" (click)="cerrarMenu()">
      <!-- Logo: coloca tu archivo en sitio-web/src/assets/logo.png (PNG, idealmente con fondo transparente). -->
      <img src="assets/logo.png" alt="Logo de {{ empresa.nombre }}" class="site-header__logo" />
      <span class="site-header__nombre">{{ empresa.nombre }}</span>
    </a>

    <button
      class="site-header__toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuAbierto()"
      aria-controls="menu-principal"
      aria-label="Abrir menú"
    >
      <span></span><span></span><span></span>
    </button>

    <nav id="menu-principal" class="site-header__nav" [class.site-header__nav--abierto]="menuAbierto()">
      <a routerLink="/" fragment="servicios" (click)="cerrarMenu()">Servicios</a>
      <a routerLink="/" fragment="como-trabajamos" (click)="cerrarMenu()">Cómo trabajamos</a>
      <a routerLink="/galeria" routerLinkActive="activo" (click)="cerrarMenu()">Proyectos</a>
      <a routerLink="/" fragment="contacto" (click)="cerrarMenu()">Contacto</a>
      <a
        class="site-header__whatsapp"
        [href]="linkWhatsapp('Hola, quiero cotizar un proyecto')"
        target="_blank"
        rel="noopener"
        (click)="cerrarMenu()"
      >
        Escríbenos por WhatsApp
      </a>
    </nav>
  </div>
</header>
